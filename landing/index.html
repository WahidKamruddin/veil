<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veil is a local proxy that redacts secrets and personal data before your prompt reaches the model, then restores them in the reply." />
    <script>
      // Apply a saved theme before first paint so dark mode never flashes light. Light is the default.
      try {
        if (localStorage.getItem('veil-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
    <title>Veil · The model never sees your secrets</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
