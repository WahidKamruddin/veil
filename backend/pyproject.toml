[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veil"
version = "0.1.0"
description = "Veil: the model never sees your secrets. A local PII & secret sanitizing proxy for LLM APIs."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
    "orjson",
]

[project.optional-dependencies]
phone = ["phonenumbers"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
